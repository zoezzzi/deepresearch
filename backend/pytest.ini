[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = 
    -v
    --tb=short
    --disable-pytest-warnings
    --cov-report=term-missing
    --cov-report=html
    --cov=harness.llm
    --cov=app.service_factory

markers =
    slow: 标记为慢速测试
    integration: 集成测试
